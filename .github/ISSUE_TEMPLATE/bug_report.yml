name: 🐞 Bug 报告
description: 工具本身出错、误报、崩溃、界面显示异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！这是一个需要结合具体环境才能定位问题的工具，**请尽量把下面的信息填全**，信息越全修得越快。

  - type: input
    id: tool_version
    attributes:
      label: 工具版本
      description: Release 页面上的 tag，或你下载的日期
      placeholder: v1.0.4
    validations:
      required: true

  - type: input
    id: dsh_version
    attributes:
      label: DSH 版本
      description: 在 DSH 目录执行 dsh --version，或看 dsh 目录下 package.json 里的 version
      placeholder: 0.2.0-rc.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: 执行 winver，或看「设置 → 系统 → 关于」
      placeholder: Windows 11 23H2 (22631)
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: 诊断报告
      description: 运行 DSH一键诊断.exe --auto，把生成的 DSH诊断报告.txt 全文粘贴到这里。涉及隐私的路径可以打码，但请保留目录结构和报错原文。
      render: text
      placeholder: 把 DSH诊断报告.txt 的内容粘贴在这里
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: 发生了什么
      description: 你做了什么操作、期望看到什么、实际发生了什么
      placeholder: |
        我点了「一键修复」，它提示修复成功，但重新诊断问题依旧。
        期望：修复后问题应该消失。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 截图、错误日志（DSH诊断工具-错误日志.txt）、你已经试过的解决办法
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我用的是最新 Release 版本
          required: true
        - label: 我已经搜索过现有 Issue，确认没有重复
          required: true
        - label: 报告里已经隐去个人隐私信息（如需）
          required: false
